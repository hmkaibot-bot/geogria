<title>高加索行李清單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{
  --bg:#F2F5F3; --paper:#FFFFFF; --ink:#1D3B34; --ink-2:#4D635C; --ink-3:#7C8F88;
  --line:#D7E0DB; --line-2:#E8EEEA; --accent:#D59A3C; --accent-ink:#8A5A17; --accent-soft:#F7EBD6;
  --ok:#2F6B4F; --warn:#A33B2A; --tag:#1D3B34; --tag-ink:#F4E6C8;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1916; --paper:#15231F; --ink:#E4EDE9; --ink-2:#A9BBB4; --ink-3:#7E918A;
    --line:#2A3F39; --line-2:#1F302B; --accent:#E3AE55; --accent-ink:#EDC27A; --accent-soft:#2E2718;
    --ok:#6DBB92; --warn:#E58371; --tag:#E3AE55; --tag-ink:#1B1508;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1916; --paper:#15231F; --ink:#E4EDE9; --ink-2:#A9BBB4; --ink-3:#7E918A;
  --line:#2A3F39; --line-2:#1F302B; --accent:#E3AE55; --accent-ink:#EDC27A; --accent-soft:#2E2718;
  --ok:#6DBB92; --warn:#E58371; --tag:#E3AE55; --tag-ink:#1B1508;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;margin:0}
a{color:var(--accent-ink)}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 64px}

/* ---- luggage-tag masthead ---- */
.tag{margin-top:18px;background:var(--tag);color:var(--tag-ink);border-radius:10px 10px 10px 10px;padding:18px 20px 16px;position:relative;overflow:hidden}
.tag::before{content:"";position:absolute;right:18px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 3px color-mix(in srgb,var(--tag-ink) 35%,transparent)}
.tag .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.tag h1{font-family:var(--serif);font-weight:900;font-size:clamp(24px,5.4vw,34px);line-height:1.2;margin:6px 0 10px;text-wrap:balance}
.route{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.04em;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.route .ar{opacity:.55}
.intro{color:var(--ink-2);font-size:14px;margin:12px 2px 0}
.intro p{margin:.3em 0}

/* ---- sticky control bar ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:10px 8px;margin-top:10px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.who{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:3px}
.who button{font:inherit;font-weight:700;font-size:14px;border:0;background:transparent;color:var(--ink-2);padding:6px 16px;border-radius:999px;cursor:pointer;min-height:36px}
.who button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.who button:focus-visible,.toggle:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.prog{flex:1 1 160px;display:flex;align-items:center;gap:10px;min-width:0}
.meter{flex:1;height:8px;border-radius:99px;background:var(--line-2);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}
.pct{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.toggle{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.toggle[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.sync{font-size:12px;color:var(--ink-3);width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink-2);font-size:13px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 10px;white-space:nowrap}
.chip-n{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chip.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.chip.done .chip-n{color:var(--ok)}

/* ---- sections ---- */
.sec{margin-top:26px;scroll-margin-top:150px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.sec-h h2{font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.3;margin:0;text-wrap:balance}
.sec-n{font-family:var(--mono);font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.sec-n.done{color:var(--ok)}
.sec-b{padding-top:6px}
.sec-b h3{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--accent-ink);margin:20px 0 4px}
.sec-b h4{font-size:14px;margin:14px 0 4px}
.sec-b p,.sec-b li{max-width:68ch}
.sec-b blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;color:var(--ink)}
.sec-b blockquote p{margin:.25em 0}
.sec-b code{font-family:var(--mono);font-size:.88em;background:var(--line-2);padding:1px 5px;border-radius:4px}
.sec-b ol,.sec-b ul:not(.checks){padding-left:1.3em}

/* tables */
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.5}
th,td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line-2)}
th{font-weight:700;color:var(--ink-2);background:color-mix(in srgb,var(--line-2) 60%,var(--paper));white-space:nowrap}
tr:last-child td{border-bottom:0}
td{min-width:6em}

/* checklist rows */
.checks{list-style:none;margin:6px 0 10px;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.item{border-bottom:1px solid var(--line-2)}
.item:last-child{border-bottom:0}
.item label{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;min-height:44px;cursor:pointer}
.item input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:0 0 22px;height:22px;margin-top:1px;border:2px solid var(--ink-3);border-radius:5px;display:grid;place-items:center;background:var(--paper);transition:background .15s,border-color .15s}
.box::after{content:"";width:6px;height:11px;border:solid var(--paper);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0}
.item input:checked + .box{background:var(--accent);border-color:var(--accent)}
.item input:checked + .box::after{opacity:1;border-color:var(--tag-ink)}
.item input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.txt{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .txt{color:var(--ink-3)}
.item.done .txt strong{color:var(--ink-3)}
.item.owned .box{border-color:var(--ok)}
body.hide-done .item.done{display:none}
body.hide-done .checks:not(:has(.item:not(.done))){display:none}

.foot{margin-top:40px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:reduce){.meter i,.box{transition:none}}
@media (max-width:520px){
  .sec{scroll-margin-top:190px}
  .who button{padding:6px 12px}
}
</style>

<div class="wrap">
  <div class="tag">
    <div class="eyebrow">Baggage · 2 pax · 25 SEP – 11 OCT 2026</div>
    <h1>{{TITLE}}</h1>
    <div class="route" aria-label="航線">
      <span>HKG</span><span class="ar">→</span><span>KUL</span><span class="ar">→</span><span>DOH</span><span class="ar">→</span><span>TBS</span><span class="ar">⇢</span><span>EVN</span><span class="ar">→</span><span>TBS</span><span class="ar">→</span><span>DOH</span><span class="ar">→</span><span>KUL</span><span class="ar">→</span><span>HKG</span>
    </div>
  </div>
  <div class="intro">{{INTRO}}</div>

  <div class="bar">
    <div class="bar-row">
      <div class="who" role="group" aria-label="邊個執緊行李">
        <button type="button" id="who-alex" data-who="alex" aria-pressed="true">Alex</button>
        <button type="button" id="who-hugo" data-who="hugo" aria-pressed="false">Hugo</button>
      </div>
      <div class="prog"><div class="meter" aria-hidden="true"><i id="meter"></i></div><span class="pct" id="pct">0/0</span></div>
      <button type="button" class="toggle" id="hide-done" aria-pressed="false">隱藏已剔</button>
      <div class="sync" id="sync">剔咗嘅嘢會儲存喺呢部機。</div>
    </div>
    <nav class="chips" aria-label="分類">{{NAV}}</nav>
  </div>

  {{SECTIONS}}

  <p class="foot">由 repo 入面嘅 26-行李清單.md 生成。Alex 同 Hugo 各有自己一份剔格進度，撳上面個名切換。</p>
</div>

<script>
(function(){
  var PEOPLE = ["alex","hugo"];
  var state = { who: "alex", hide: false };
  var checked = { alex: {}, hugo: {} };
  var db = null, dbOk = false;
  var pending = { alex: null, hugo: null }, writing = { alex: false, hugo: false }, dirty = { alex: false, hugo: false };

  function lsGet(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } }
  function lsSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

  var saved = lsGet("pack-ui");
  if (saved && PEOPLE.indexOf(saved.who) >= 0) state.who = saved.who;
  if (saved && saved.hide) state.hide = true;
  PEOPLE.forEach(function(p){ var c = lsGet("pack-" + p); if (c && typeof c === "object") checked[p] = c; });

  var boxes = Array.prototype.slice.call(document.querySelectorAll('.item input[type="checkbox"]'));
  var sync = document.getElementById("sync");

  function paint(){
    var map = checked[state.who] || {};
    var total = 0, done = 0, bySec = {};
    boxes.forEach(function(b){
      var on = !!map[b.dataset.id];
      b.checked = on;
      var li = b.closest(".item"); li.classList.toggle("done", on);
      var sec = b.closest(".sec").dataset.sec;
      bySec[sec] = bySec[sec] || [0,0];
      bySec[sec][1]++; total++;
      if (on){ bySec[sec][0]++; done++; }
    });
    Object.keys(bySec).forEach(function(s){
      var v = bySec[s], full = v[0] === v[1];
      document.querySelectorAll('[data-count="' + s + '"]').forEach(function(el){
        el.textContent = v[0] + "/" + v[1];
        el.classList.toggle("done", full);
        var chip = el.closest(".chip"); if (chip) chip.classList.toggle("done", full);
      });
    });
    document.getElementById("pct").textContent = done + "/" + total;
    document.getElementById("meter").style.width = (total ? (done / total * 100) : 0) + "%";
    PEOPLE.forEach(function(p){ document.getElementById("who-" + p).setAttribute("aria-pressed", String(p === state.who)); });
    document.getElementById("hide-done").setAttribute("aria-pressed", String(state.hide));
    document.body.classList.toggle("hide-done", state.hide);
  }

  function saveUi(){ lsSet("pack-ui", { who: state.who, hide: state.hide }); }

  function flush(p){
    if (!dbOk || writing[p]) return;
    writing[p] = true; dirty[p] = false;
    var body = { checked: Object.assign({}, checked[p]) };
    db.doc("packing/" + p).set(body).then(function(){
      writing[p] = false;
      sync.textContent = "已同步 · Alex 同 Hugo 開呢頁都見到大家嘅進度。";
      if (dirty[p]) flush(p);
    }).catch(function(e){
      writing[p] = false;
      if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) {
        dbOk = false;
        sync.textContent = "呢個帳戶唔可以同步，剔咗嘅嘢只會存喺呢部機。";
      } else {
        dirty[p] = true;
        sync.textContent = "同步失敗，已存喺呢部機；下次剔格會再試。";
      }
    });
  }

  function schedule(p){
    dirty[p] = true;
    clearTimeout(pending[p]);
    pending[p] = setTimeout(function(){ flush(p); }, 700);
  }

  boxes.forEach(function(b){
    b.addEventListener("change", function(){
      var p = state.who, id = b.dataset.id;
      if (b.checked) checked[p][id] = true; else delete checked[p][id];
      lsSet("pack-" + p, checked[p]);
      paint();
      if (dbOk) schedule(p);
    });
  });
  PEOPLE.forEach(function(p){
    document.getElementById("who-" + p).addEventListener("click", function(){ state.who = p; saveUi(); paint(); });
  });
  document.getElementById("hide-done").addEventListener("click", function(){ state.hide = !state.hide; saveUi(); paint(); });

  paint();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then(function(d){
      if (!d) return;
      db = d; dbOk = true;
      sync.textContent = "連接緊同步…";
      PEOPLE.forEach(function(p){
        db.doc("packing/" + p).onSnapshot(function(snap){
          if (dirty[p] || writing[p]) return;
          var data = snap.exists ? snap.data() : null;
          if (data && data.checked && typeof data.checked === "object") {
            checked[p] = Object.assign({}, data.checked);
            lsSet("pack-" + p, checked[p]);
          } else if (!snap.exists && Object.keys(checked[p]).length) {
            schedule(p);
          }
          sync.textContent = "已同步 · Alex 同 Hugo 開呢頁都見到大家嘅進度。";
          paint();
        }, function(){
          dbOk = false;
          sync.textContent = "同步中斷，剔咗嘅嘢會繼續存喺呢部機。";
        });
      });
    }).catch(function(){});
  }
})();
</script>
